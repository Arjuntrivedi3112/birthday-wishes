  <body>
    <main class="wrap">
      <article class="card" aria-labelledby="title">
        <svg class="cake" viewBox="0 0 120 90" aria-hidden="true">
          <ellipse cx="60" cy="82" rx="42" ry="5" fill="#4a2c3a" opacity=".06" />
          <rect x="22" y="44" width="76" height="36" rx="8" fill="#f9d5de" />
          <path d="M22 54 q9 8 19 0 t19 0 t19 0 t19 0 V52 a8 8 0 0 0 -8 -8 H30 a8 8 0 0 0 -8 8z" fill="#fff7f2" />
          <rect x="22" y="66" width="76" height="3" fill="#e594aa" opacity=".5" />
          <rect x="44" y="26" width="5" height="18" rx="2.5" fill="#e3cb93" />
          <rect x="58" y="22" width="5" height="22" rx="2.5" fill="#e3cb93" />
          <rect x="72" y="26" width="5" height="18" rx="2.5" fill="#e3cb93" />
          <path class="flame" d="M46.5 14c3 4 3 7 0 9c-3-2-3-5 0-9z" fill="#d4718f" />
          <path class="flame f2" d="M60.5 10c3 4 3 7 0 9c-3-2-3-5 0-9z" fill="#d4718f" />
          <path class="flame f3" d="M74.5 14c3 4 3 7 0 9c-3-2-3-5 0-9z" fill="#d4718f" />
        </svg>

        <p class="eyebrow">21 October</p>
        <h1 id="title">Birthday wishes for <em>Jiya Shah</em></h1>
        <p class="intro">Jiya turns 22 on 21 October. Write her a few words, and your message will reach her on her birthday.</p>
        <p class="secret">It's a surprise, so please don't mention this page to her.</p>

        <form id="wish-form" novalidate>
          <label for="from_name">Your name</label>
          <input id="from_name" name="from_name" autocomplete="name" maxlength="80" placeholder="e.g. Riya (college)" required />

          <label for="message">Your birthday message</label>
          <textarea id="message" name="message" maxlength="1500" rows="7" placeholder="Happy birthday, Jiya…" required></textarea>
          <p class="count" id="count" aria-live="polite">0 / 1500</p>

          <!-- left empty by humans; bots tend to fill it -->
          <div class="hp" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <p class="error" id="error" role="alert"></p>
          <button type="submit" id="submit">Send my wish</button>
        </form>

        <div class="done" id="done" hidden tabindex="-1">
          <h2>Thank you<span id="thanks-name"></span>!</h2>
          <p>Your wish is safely tucked away and will reach Jiya on her birthday.</p>
          <button type="button" id="again" class="ghost">Write another wish</button>
        </div>
      </article>
    </main>
  </body>
</html>
